<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Fintrack</title>
  <desc id="desc">Fintrack — personal finance that trusts your rates. Budgets, goals and a multi-currency ledger; a native macOS app and a web app that share one JSON file.</desc>
  <rect width="1200" height="340" rx="26" fill="#000"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="25.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/>

  <!-- the mark: black tile, solid neon card, stripe and chip cut out (same geometry as the app icon) -->
  <g transform="translate(64 70) scale(0.78)">
    <rect width="256" height="256" rx="56" fill="#000" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <path fill="#3CFFA0" fill-rule="evenodd" d="M66 78h124a14 14 0 0 1 14 14v72a14 14 0 0 1-14 14H66a14 14 0 0 1-14-14V92a14 14 0 0 1 14-14zM52 104h152v16H52zM72 140h40v10H72z"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="306" y="126" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#FFFFFF">Fintrack</text>
    <text x="308" y="172" font-size="24" font-weight="600" fill="#D9DEDB">Personal finance that trusts your rates.</text>
    <text x="308" y="206" font-size="19" fill="#8E9590">Budgets, goals and a multi-currency ledger — offline.</text>
    <text x="308" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2" fill="#3CFFA0">MACOS APP · WEB APP · SAME FILE</text>
  </g>

  <!-- rate line, the signature feature -->
  <g transform="translate(860 92)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect width="276" height="156" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="24" y="40" font-size="13" letter-spacing="2" fill="#8E9590">YOUR RATE</text>
    <text x="24" y="82" font-size="26" font-weight="600" fill="#FFFFFF">1 USD = 12 310</text>
    <text x="24" y="124" font-size="15" fill="#3CFFA0">100 USD → 1 231 000 soʻm</text>
  </g>
</svg>
